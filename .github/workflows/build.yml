name: Build VST3 (macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Installer CMake
        run: brew install cmake

      - name: Configurer
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compiler
        run: cmake --build build --config Release --parallel 4

      - name: Signature
        run: |
          find build -type d -name "*.vst3" -print0 | while IFS= read -r -d '' p; do
            codesign --force --deep -s - "$p"
          done
          find build -type d -name "*.component" -print0 | while IFS= read -r -d '' p; do
            codesign --force --deep -s - "$p"
          done

      - name: Empaqueter
        run: |
          mkdir -p dist/VST3 dist/AU
          find build -type d -name "*.vst3"      -exec cp -R {} dist/VST3/ \;
          find build -type d -name "*.component" -exec cp -R {} dist/AU/ \;
          cd dist && zip -r ../DistortionPack-macOS.zip .

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: DistortionPack-macOS
          path: DistortionPack-macOS.zip
          if-no-files-found: error
          retention-days: 90

      - name: Release (si tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DistortionPack-macOS.zip
